name: run-experiments

# Re-runs every experiment on the committed CESNET data in the cloud, so the
# numbers and figures in the README are reproducible by anyone, with no local
# setup. Outputs are uploaded as a downloadable artifact.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Step 1 - benign drift
        run: python experiments/step1_benign_drift.py
      - name: Step 1b - calibrated drift (permutation tests)
        run: python experiments/step1b_calibrated_drift.py
      - name: Step 2 - detector decay
        run: python experiments/step2_detector_decay.py
      - name: Step 2b - deeper analysis
        run: python experiments/step2b_deeper_analysis.py
      - name: Step 2c - what drives the decay
        run: python experiments/step2c_what_drives_decay.py
      - name: Fetch UGR'16 (real attack data)
        run: python experiments/fetch_ugr16.py
      - name: Step 3 - drift vs attack separability
        run: python experiments/step3_separability.py
      - name: Step 3d - magnitude-matched separability
        run: python experiments/step3d_magnitude_matched.py
      - name: Step 3b - influence geometry + adaptive adversary
        run: python experiments/step3b_deep_separability.py
      - name: Step 3c - separability per attack family
        run: python experiments/step3c_per_family.py
      - name: Figures
        run: python experiments/make_figures.py
      - name: Upload results and figures
        uses: actions/upload-artifact@v4
        with:
          name: drift-experiment-outputs
          path: |
            results/
            figures/
          if-no-files-found: error
